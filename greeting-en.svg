<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 720 130'
    style='background-color: #00000000;'
    width='720px' height='130px'>

    <style>
@font-face {
  font-family: 'Nanum Pen Script';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                            <path id='path0'>
                            <!-- Multiline -->
                                <animate id='d0' attributeName='d' begin='0s;d1.end' dur='30000ms' fill='freeze' values='m0,45 h0 ; m0,45 h720 ; m0,45 h720' keyTimes='0;0.1167;1' />
                    </path>
    <text font-family='"Nanum Pen Script", monospace' fill='#8FA2FF' font-size='46'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Hi, I&#039;m Saeyeon Kim
        </textPath>
    </text>
                <path id='path1'>
                            <!-- Multiline -->
                                <animate id='d1' attributeName='d' begin='0s;d1.end' dur='30000ms' fill='freeze' values='m0,100 h0 ; m0,100 h0 ; m0,100 h720 ; m0,100 h720' keyTimes='0;0.1433;0.2767;1' />
                    </path>
    <text font-family='"Nanum Pen Script", monospace' fill='#B7C3FF' font-size='34'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Momenta hodierna, memoriae crastinae
        </textPath>
    </text>
</svg>
